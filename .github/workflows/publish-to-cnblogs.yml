name: Publish to Cnblogs

on:
  schedule:
    - cron: '0 0,12 * * *'  # 每天 00:00 �?12:00 运行
  workflow_dispatch:          # 允许手动触发

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: qiao-925/assemble-publish
          token: \$\{\{ secrets.ASSEMBLE_OUTPUT_PAT \}\}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Set environment variables
        env:
          SYNC_REPO_URL: 'https://github.com/qiao-925/assemble-archive.git'
          SYNC_REPO_TOKEN: ${{ secrets.ASSEMBLE_OUTPUT_PAT }}
          CNBLOGS_RPC_URL: ${{ secrets.CNBLOGS_RPC_URL }}
          CNBLOGS_USERNAME: ${{ secrets.CNBLOGS_USERNAME }}
          CNBLOGS_TOKEN: ${{ secrets.CNBLOGS_TOKEN }}
        run: |
          echo "SYNC_REPO_URL=$SYNC_REPO_URL" >> .env
          echo "SYNC_REPO_TOKEN=$SYNC_REPO_TOKEN" >> .env
          echo "CNBLOGS_RPC_URL=$CNBLOGS_RPC_URL" >> .env
          echo "CNBLOGS_USERNAME=$CNBLOGS_USERNAME" >> .env
          echo "CNBLOGS_TOKEN=$CNBLOGS_TOKEN" >> .env

      - name: Run sync script
        run: python scripts/run_sync.py
